<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ADOFAI Multi UI 설계판</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;700&family=Noto+Sans+KR:wght@400;500;700;900&family=Nanum+Gothic:wght@400;700;800&family=Do+Hyeon&family=Black+Han+Sans&family=Jua&family=Gowun+Dodum&family=Orbit&family=Gothic+A1:wght@400;700;900&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* 레이아웃: 왼쪽 화면 목록+부품 / 가운데 1920×1080 게임 화면 / 오른쪽 속성. 어두운 작업대 하나로 고정 */
:root{
  --bg:#101215; --panel:#171a1f; --panel2:#1e2229; --line:#2a3039; --txt:#e6e9ee; --sub:#8a93a3;
  --ice:#5ab8ff; --fire:#ff7a45; --ok:#5fd18b; --warn:#ffc04d;
  --ui:"IBM Plex Sans KR", "Noto Sans KR", system-ui, sans-serif; --mono:"IBM Plex Mono", ui-monospace, monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--txt);font:14px/1.45 var(--ui);display:grid;grid-template-rows:52px 1fr;overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--ice);outline-offset:1px}

header{display:flex;align-items:center;gap:14px;padding:0 16px;border-bottom:1px solid var(--line);background:var(--panel)}
header h1{font-size:15px;margin:0;font-weight:700;letter-spacing:.2px}
header h1 b{color:var(--fire)} header h1 i{font-style:normal;color:var(--ice)}
.status{font-size:12px;color:var(--sub);display:flex;align-items:center;gap:6px}
.dot{width:8px;height:8px;border-radius:50%;background:var(--sub)}
.dot.ok{background:var(--ok)} .dot.busy{background:var(--warn)} .dot.err{background:var(--fire)}
.spacer{flex:1}
.btn{border:1px solid var(--line);background:var(--panel2);padding:6px 12px;border-radius:7px}
.btn:hover{border-color:#3a4250}
.btn.pri{background:var(--ice);border-color:var(--ice);color:#06131f;font-weight:700}
.btn.sm{padding:3px 8px;font-size:12px}
.btn.danger:hover{border-color:var(--fire);color:var(--fire)}

main{display:grid;grid-template-columns:232px 1fr 300px;min-height:0}
aside{background:var(--panel);overflow:auto;min-height:0}
aside.left{border-right:1px solid var(--line)} aside.right{border-left:1px solid var(--line)}
.sec{padding:12px 14px;border-bottom:1px solid var(--line)}
.sec h2{font-size:11px;letter-spacing:.8px;color:var(--sub);margin:0 0 8px;font-weight:500;display:flex;align-items:center;gap:6px}
.sec h2 .spacer{flex:1}
.screens{display:flex;flex-direction:column;gap:3px}
.scr{display:flex;align-items:center;gap:8px;padding:7px 9px;border-radius:7px;cursor:pointer;border:1px solid transparent}
.scr:hover{background:var(--panel2)}
.scr.on{background:var(--panel2);border-color:var(--line)}
.scr .n{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.scr .c{font:11px var(--mono);color:var(--sub)}
.pill{font-size:10px;padding:1px 6px;border-radius:9px;background:#2b3a2f;color:var(--ok)}
.pal{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.pal button{border:1px solid var(--line);background:var(--panel2);border-radius:7px;padding:8px 6px;text-align:left;font-size:13px;display:flex;gap:7px;align-items:center}
.pal button:hover{border-color:var(--ice)}
.pal svg{flex:none}
.hint{font-size:12px;color:var(--sub);margin:0}
kbd{font:11px var(--mono);background:var(--panel2);border:1px solid var(--line);border-radius:4px;padding:0 4px}

.stagewrap{position:relative;min-width:0;min-height:0;overflow:hidden;background:
  radial-gradient(circle at 1px 1px,#1d2128 1px,transparent 0) 0 0/16px 16px, var(--bg)}
.stage{position:absolute;left:0;top:0;width:1920px;height:1080px;transform-origin:0 0;background:#0d0f12;box-shadow:0 0 0 1px var(--line),0 20px 60px #0008;overflow:hidden}
.stage .bgimg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;pointer-events:none}
.stage .grid{position:absolute;inset:0;pointer-events:none;background-image:linear-gradient(#ffffff08 1px,transparent 1px),linear-gradient(90deg,#ffffff08 1px,transparent 1px);background-size:40px 40px}
.res{position:absolute;right:12px;bottom:10px;font:11px var(--mono);color:var(--sub);background:#0009;padding:2px 7px;border-radius:5px;pointer-events:none}
.empty{position:absolute;inset:0;display:grid;place-items:center;text-align:center;color:var(--sub)}

.el{position:absolute;display:flex;overflow:hidden;user-select:none;cursor:move}
.el .t{width:100%;padding:0 14px;white-space:pre-wrap;overflow:hidden;line-height:1.25}
.el.sel{outline:2px solid var(--ice);outline-offset:0}
.el:hover:not(.sel){outline:1px dashed #5ab8ff88}
.el .tag{position:absolute;left:0;top:-1px;transform:translateY(-100%);font:11px var(--ui);background:var(--ice);color:#06131f;padding:1px 6px;border-radius:4px 4px 0 0;white-space:nowrap;display:none;pointer-events:none}
.el.sel .tag{display:block}
.fn{position:absolute;right:4px;top:4px;width:9px;height:9px;border-radius:50%;background:var(--fire);box-shadow:0 0 0 2px #0006;pointer-events:none}
.h{position:absolute;width:12px;height:12px;background:#fff;border:2px solid var(--ice);border-radius:3px;z-index:5}
.h.nw{left:-6px;top:-6px;cursor:nwse-resize}.h.ne{right:-6px;top:-6px;cursor:nesw-resize}
.h.sw{left:-6px;bottom:-6px;cursor:nesw-resize}.h.se{right:-6px;bottom:-6px;cursor:nwse-resize}
.h.n{left:calc(50% - 6px);top:-6px;cursor:ns-resize}.h.s{left:calc(50% - 6px);bottom:-6px;cursor:ns-resize}
.h.w{top:calc(50% - 6px);left:-6px;cursor:ew-resize}.h.e{top:calc(50% - 6px);right:-6px;cursor:ew-resize}

.props label{display:block;font-size:12px;color:var(--sub);margin:9px 0 4px}
.props input[type=text],.props input[type=number],.props select,.props textarea{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:6px 8px}
.props textarea{resize:vertical;min-height:58px}
.row{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.row4{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.row4 input{font:12px var(--mono)!important;padding:5px 6px!important}
.colorrow{display:flex;gap:6px;align-items:center}
.colorrow input[type=color]{width:34px;height:30px;padding:0;border:1px solid var(--line);border-radius:6px;background:none}
.colorrow input[type=text]{font-family:var(--mono)}
.sw{display:flex;gap:4px;flex-wrap:wrap;margin-top:5px}
.sw button{width:18px;height:18px;border-radius:4px;border:1px solid #0006;padding:0}
.seg{display:flex;border:1px solid var(--line);border-radius:6px;overflow:hidden}
.seg button{flex:1;border:0;background:var(--bg);padding:5px 0;font-size:12px}
.seg button.on{background:var(--panel2);color:var(--ice)}
.acts{display:flex;gap:6px;flex-wrap:wrap;margin-top:12px}
.note{background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:10px;font-size:12px;color:var(--sub)}
.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:var(--panel2);border:1px solid var(--line);padding:8px 14px;border-radius:8px;font-size:13px;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.on{opacity:1}
.modal{position:fixed;inset:0;background:#000a;display:none;place-items:center;z-index:50}
.modal.on{display:grid}
.modal .box{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:18px;width:min(520px,92vw)}
.modal h3{margin:0 0 6px;font-size:16px}
.modal textarea,.modal input{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:7px;padding:8px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<header>
  <h1><b>ADOFAI</b> <i>Multi</i> · UI 설계판</h1>
  <div class="status"><span class="dot" id="dot"></span><span id="stat">연결 중…</span></div>
  <div class="spacer"></div>
  <button class="btn" id="undoBtn" title="되돌리기 (Ctrl+Z)">되돌리기</button>
  <button class="btn" id="gridBtn">격자 끄기</button>
  <button class="btn" id="copyBtn">설계 JSON 복사</button>
  <button class="btn pri" id="handBtn">Claude에게 넘기기</button>
</header>
<main>
  <aside class="left">
    <div class="sec">
      <h2>화면 <span class="spacer"></span><button class="btn sm" id="addScr">+ 화면</button></h2>
      <div class="screens" id="screens"></div>
    </div>
    <div class="sec">
      <h2>부품 넣기</h2>
      <div class="pal" id="pal"></div>
    </div>
    <div class="sec">
      <h2>조작</h2>
      <p class="hint">끌어서 이동 · 모서리로 크기 조절<br><kbd>Delete</kbd> 지우기 · <kbd>Ctrl</kbd>+<kbd>D</kbd> 복제<br><kbd>←↑→↓</kbd> 1px (<kbd>Shift</kbd> 10px) · <kbd>Alt</kbd> 누르고 끌면 자석 끔<br>참고 스크린샷을 화면에 끌어다 놓으면 배경으로 깔려요.</p>
    </div>
  </aside>

  <div class="stagewrap" id="wrap">
    <div class="stage" id="stage"></div>
    <div class="res" id="res">1920 × 1080</div>
  </div>

  <aside class="right" id="right"></aside>
</main>

<div class="modal" id="modal"><div class="box" id="mbox"></div></div>
<div class="toast" id="toast"></div>
<input type="file" id="file" accept="image/*" hidden>

<script>
"use strict";
const W = 1920, H = 1080, SNAP = 8;
const TYPES = {
  panel:   {name:"패널",     w:520, h:360, fill:"#1b1f26", stroke:"#2c333d", color:"#e8ecf1", size:18, weight:500, radius:16, text:""},
  button:  {name:"버튼",     w:220, h:56,  fill:"#5ab8ff", stroke:"#5ab8ff", color:"#06131f", size:20, weight:700, radius:12, text:"버튼", align:"center"},
  text:    {name:"텍스트",   w:360, h:48,  fill:"transparent", stroke:"transparent", color:"#e8ecf1", size:26, weight:700, radius:0, text:"제목 텍스트"},
  input:   {name:"입력칸",   w:420, h:52,  fill:"#0f1216", stroke:"#2c333d", color:"#7d8796", size:18, weight:400, radius:10, text:"입력하세요"},
  list:    {name:"목록",     w:560, h:420, fill:"#141820", stroke:"#2c333d", color:"#e8ecf1", size:17, weight:500, radius:12, text:"항목"},
  chip:    {name:"칩/토글",  w:120, h:40,  fill:"#232a33", stroke:"#3a4452", color:"#e8ecf1", size:16, weight:500, radius:20, text:"칩", align:"center"},
  progress:{name:"진행바",   w:420, h:14,  fill:"#232a33", stroke:"transparent", color:"#5ab8ff", size:14, weight:400, radius:7, text:""},
  slider:  {name:"슬라이더", w:420, h:36,  fill:"#232a33", stroke:"transparent", color:"#ff7a45", size:14, weight:400, radius:4, text:""},
  image:   {name:"이미지 자리", w:240, h:240, fill:"#1b1f26", stroke:"#3a4452", color:"#8a93a3", size:16, weight:500, radius:12, text:"이미지"},
  ranking: {name:"순위표",   w:300, h:420, fill:"#0d0f12cc", stroke:"#2c333d", color:"#e8ecf1", size:16, weight:500, radius:12, text:"실시간 순위"},
};
const FONTS = [
  ["game","게임 기본 글꼴","'Noto Sans KR'"],["Noto Sans KR","Noto Sans KR","'Noto Sans KR'"],["Nanum Gothic","나눔고딕","'Nanum Gothic'"],
  ["Gothic A1","Gothic A1","'Gothic A1'"],["IBM Plex Sans KR","IBM Plex Sans KR","'IBM Plex Sans KR'"],["Do Hyeon","도현","'Do Hyeon'"],
  ["Black Han Sans","검은고딕","'Black Han Sans'"],["Jua","주아","'Jua'"],["Gowun Dodum","고운돋움","'Gowun Dodum'"],["Orbit","Orbit","'Orbit'"],
];
const FUNCS = ["(없음)","프로필 열기","닫기","TUF 탭","미평가 포함","Q 포함","기타 포함","맵 난이도","맵 난이도 아이콘","방 만들기","방 코드로 참가","공개 방 목록","공개/비공개 전환","방 이름 입력","방 코드 복사","Steam 초대","맵 고르기 열기","TUF 검색","난이도 범위 필터","정렬 바꾸기","내 컴퓨터 맵 목록","이 맵으로 시작","맵 받기 진행률","받기 일시정지/재개","받기 취소","준비 (F5)","카운트다운","기권","실시간 순위표","플레이어 명단","진행 단계 표시","결과 순위","한 판 더","로비로 돌아가기","방 나가기","설정 열기","테마 바꾸기","업데이트 확인","알림 메시지","직접 적기"];
const SWATCH = ["#0d0f12","#141820","#1b1f26","#2c333d","#e8ecf1","#8a93a3","#5ab8ff","#ff7a45","#ffd166","#5fd18b","#c084fc","#ffffff","transparent"];

let db = null, assets = null, canWrite = true;
let screens = [];            // [{id,name,order,note,bg,bgOpacity,status,elements:[]}]
let curId = null, selId = null, showGrid = true;
const hist = {};             // screenId -> [json...]
const saveState = {};        // screenId -> {timer, writing, again}
const $ = s => document.querySelector(s);
const uid = () => Math.random().toString(36).slice(2, 9);
const cur = () => screens.find(s => s.id === curId);
const selEl = () => { const s = cur(); return s && s.elements.find(e => e.id === selId); };
const fontCss = f => (FONTS.find(x => x[0] === f) || FONTS[0])[2] + ", 'Noto Sans KR', sans-serif";
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

function toast(t){ const el=$("#toast"); el.textContent=t; el.classList.add("on"); clearTimeout(toast.t); toast.t=setTimeout(()=>el.classList.remove("on"),1800); }
function status(kind, text){ $("#dot").className = "dot " + kind; $("#stat").textContent = text; }

// ---------- 저장 ----------
function pushHist(){ const s=cur(); if(!s) return; const h=hist[s.id]||(hist[s.id]=[]); const j=JSON.stringify(s.elements); if(h[h.length-1]!==j){ h.push(j); if(h.length>60) h.shift(); } }
function undo(){ const s=cur(); const h=s&&hist[s.id]; if(!h||h.length<2) return toast("되돌릴 게 없어요"); h.pop(); s.elements=JSON.parse(h[h.length-1]); selId=null; render(); queueSave(s); }
function queueSave(s, now){
  if(!db || !canWrite) return;
  const st = saveState[s.id] || (saveState[s.id] = {});
  clearTimeout(st.timer); st.queued = true;
  status("busy","저장 중…");
  st.timer = setTimeout(() => writeScreen(s), now ? 0 : 700);
}
async function writeScreen(s){
  const st = saveState[s.id];
  st.queued = false;
  if(st.writing){ st.again = true; return; }
  st.writing = true;
  try{
    s.updatedAt = Date.now();
    await db.collection("screens").doc(s.id).set(JSON.parse(JSON.stringify(s)));
    status("ok","저장됨 · " + new Date().toLocaleTimeString("ko-KR",{hour:"2-digit",minute:"2-digit"}));
  }catch(e){
    if(e && e.code==="invalid_argument"){ canWrite=false; status("err","보기 전용이에요 (저장 권한 없음)"); }
    else status("err","저장 실패: " + (e && e.message || e));
  }
  st.writing = false;
  if(st.again){ st.again=false; writeScreen(s); }
}

// ---------- 그리기 ----------
function renderScreens(){
  const box=$("#screens"); box.innerHTML="";
  screens.sort((a,b)=>(a.order??0)-(b.order??0)).forEach(s=>{
    const d=document.createElement("div"); d.className="scr"+(s.id===curId?" on":"");
    d.innerHTML=`<span class="n">${esc(s.name)}</span>${s.status==="ready"?'<span class="pill">넘김</span>':""}<span class="c">${s.elements.length}</span>`;
    d.onclick=()=>{ curId=s.id; selId=null; pushHist(); render(); };
    d.ondblclick=()=>renameScreen(s);
    box.appendChild(d);
  });
}

function elInner(e){
  const fs=`font-family:${fontCss(e.font)};font-size:${e.size}px;font-weight:${e.weight};color:${e.color};text-align:${e.align||"left"}`;
  const t=esc(e.text);
  switch(e.type){
    case "list": {
      const rows=Math.max(1,Math.floor((e.h-16)/64)); let r="";
      for(let i=0;i<Math.min(rows,12);i++) r+=`<div style="height:56px;margin:8px 8px 0;border-radius:${Math.min(e.radius,10)}px;background:#ffffff0a;display:flex;align-items:center;padding:0 14px;${fs}">${t} ${i+1}</div>`;
      return `<div style="width:100%">${r}</div>`;
    }
    case "progress": return `<div style="width:62%;background:${e.color};border-radius:${e.radius}px"></div>`;
    case "slider": return `<div style="position:absolute;left:0;right:0;top:50%;height:8px;margin-top:-4px;border-radius:4px;background:linear-gradient(90deg,${e.color} 55%,#ffffff22 55%)"></div><div style="position:absolute;left:55%;top:50%;width:26px;height:26px;margin:-13px;border-radius:50%;background:#fff;border:3px solid ${e.color}"></div>`;
    case "image": return `<svg width="100%" height="100%" style="position:absolute;inset:0"><line x1="0" y1="0" x2="100%" y2="100%" stroke="${e.stroke}"/><line x1="100%" y1="0" x2="0" y2="100%" stroke="${e.stroke}"/></svg><div class="t" style="${fs};text-align:center;position:relative;align-self:center">${t}</div>`;
    case "ranking": {
      let r=`<div class="t" style="${fs};font-weight:700;padding:12px 14px 6px">${t}</div>`;
      ["창탱이 · 99.82%","친구1 · 99.10%","친구2 · 97.45%","친구3 · 95.03%"].forEach((n,i)=>r+=`<div style="${fs};font-size:${Math.max(11,e.size-2)}px;padding:6px 14px;opacity:${1-i*.15}">${i+1}. ${n}</div>`);
      return `<div style="width:100%">${r}</div>`;
    }
    case "panel": return t?`<div class="t" style="${fs};padding:16px 18px;align-self:flex-start">${t}</div>`:"";
    default: return `<div class="t" style="${fs};align-self:center">${t}</div>`;
  }
}

function renderStage(){
  const st=$("#stage"), s=cur();
  st.innerHTML="";
  if(!s){ st.innerHTML=`<div class="empty"><div><p style="font-size:22px;margin:0 0 6px;color:#e8ecf1">아직 화면이 없어요</p><p>왼쪽 위 “+ 화면”으로 첫 화면을 만들어 주세요.</p></div></div>`; return; }
  if(s.bg){ const img=document.createElement("img"); img.className="bgimg"; img.src="/_blob/"+s.bg; img.style.opacity=s.bgOpacity??0.5; st.appendChild(img); }
  if(showGrid){ const g=document.createElement("div"); g.className="grid"; st.appendChild(g); }
  s.elements.forEach(e=>{
    const d=document.createElement("div");
    d.className="el"+(e.id===selId?" sel":""); d.dataset.id=e.id;
    Object.assign(d.style,{left:e.x+"px",top:e.y+"px",width:e.w+"px",height:e.h+"px",background:e.fill,border:e.stroke&&e.stroke!=="transparent"?`2px solid ${e.stroke}`:"none",borderRadius:e.radius+"px",opacity:e.opacity??1,justifyContent:e.align==="center"?"center":e.align==="right"?"flex-end":"flex-start",alignItems:"center",overflow:e.type==="ranking"||e.type==="list"||e.type==="panel"?"hidden":"visible"});
    d.innerHTML=elInner(e)+`<span class="tag">${esc(e.name||TYPES[e.type].name)}${e.func&&e.func!=="(없음)"?" · "+esc(e.func==="직접 적기"?(e.funcText||"기능"):e.func):""}</span>`+(e.func&&e.func!=="(없음)"?'<span class="fn"></span>':"");
    if(e.id===selId) ["nw","n","ne","e","se","s","sw","w"].forEach(k=>{ const h=document.createElement("div"); h.className="h "+k; h.dataset.h=k; d.appendChild(h); });
    d.addEventListener("pointerdown",onDown);
    st.appendChild(d);
  });
}

function fit(){
  const w=$("#wrap"), pad=36;
  const sc=Math.min((w.clientWidth-pad*2)/W,(w.clientHeight-pad*2)/H);
  const st=$("#stage"); st.style.transform=`translate(${(w.clientWidth-W*sc)/2}px,${(w.clientHeight-H*sc)/2}px) scale(${sc})`;
  fit.sc=sc;
  $("#res").textContent=`1920 × 1080 · ${Math.round(sc*100)}%`;
}

function colorField(id,label,val){
  return `<label for="${id}">${label}</label><div class="colorrow"><input type="color" id="${id}c" value="${/^#[0-9a-f]{6}/i.test(val)?val.slice(0,7):"#000000"}"><input type="text" id="${id}" value="${esc(val)}"></div><div class="sw" data-for="${id}">${SWATCH.map(c=>`<button title="${c}" data-c="${c}" style="background:${c==="transparent"?"repeating-conic-gradient(#555 0 25%,#333 0 50%) 0 0/8px 8px":c}"></button>`).join("")}</div>`;
}

function renderProps(){
  const r=$("#right"), s=cur(), e=selEl();
  if(!s){ r.innerHTML=""; return; }
  if(!e){
    r.innerHTML=`<div class="sec props"><h2>화면 설정</h2>
      <label for="pName">화면 이름</label><input type="text" id="pName" value="${esc(s.name)}">
      <label for="pNote">이 화면에 대한 메모 (Claude가 읽어요)</label><textarea id="pNote" placeholder="예: 방 목록은 최근 순, 꽉 찬 방은 흐리게">${esc(s.note||"")}</textarea>
      <label>참고 스크린샷</label>
      <div class="acts" style="margin-top:0"><button class="btn sm" id="bgUp">${s.bg?"바꾸기":"올리기"}</button>${s.bg?'<button class="btn sm danger" id="bgDel">빼기</button>':""}</div>
      ${s.bg?`<label for="pBgO">투명도 ${Math.round((s.bgOpacity??.5)*100)}%</label><input type="range" id="pBgO" min="0" max="1" step="0.05" value="${s.bgOpacity??.5}" style="width:100%">`:""}
      <div class="acts"><button class="btn sm" id="dupScr">화면 복제</button><button class="btn sm danger" id="delScr">화면 지우기</button></div>
    </div>
    <div class="sec"><div class="note">부품을 누르면 여기서 글꼴·색·크기와 <b style="color:var(--fire)">기능</b>을 정할 수 있어요. 주황 점이 붙은 부품은 기능이 연결된 거예요.</div></div>`;
    $("#pName").oninput=ev=>{ s.name=ev.target.value; renderScreens(); queueSave(s); };
    $("#pNote").oninput=ev=>{ s.note=ev.target.value; queueSave(s); };
    $("#bgUp").onclick=()=>pickBg();
    if(s.bg){ $("#bgDel").onclick=()=>{ s.bg=null; render(); queueSave(s); }; $("#pBgO").oninput=ev=>{ s.bgOpacity=+ev.target.value; const img=$("#stage .bgimg"); if(img) img.style.opacity=s.bgOpacity; ev.target.previousElementSibling.textContent=`투명도 ${Math.round(s.bgOpacity*100)}%`; queueSave(s); }; }
    $("#dupScr").onclick=()=>{ const c=JSON.parse(JSON.stringify(s)); c.id="s"+uid(); c.name=s.name+" 사본"; c.order=(Math.max(...screens.map(x=>x.order??0))+1); c.status=""; c.elements.forEach(x=>x.id=uid()); screens.push(c); curId=c.id; render(); queueSave(c,true); };
    $("#delScr").onclick=()=>confirmBox(`“${s.name}” 화면을 지울까요? 되돌릴 수 없어요.`,"지우기",async()=>{ screens=screens.filter(x=>x!==s); curId=screens[0]?.id||null; selId=null; render(); try{ await db.collection("screens").doc(s.id).delete(); }catch(_){} });
    return;
  }
  const T=TYPES[e.type];
  r.innerHTML=`<div class="sec props"><h2>${esc(T.name)} <span class="spacer"></span><span style="font:11px var(--mono)">${e.id}</span></h2>
    <label for="pLbl">부품 이름</label><input type="text" id="pLbl" value="${esc(e.name||"")}" placeholder="${esc(T.name)}">
    <label for="pTxt">글자</label><textarea id="pTxt" rows="2">${esc(e.text)}</textarea>
    <p class="hint" style="margin-top:4px">게임 값 넣기: <kbd>{song}</kbd> <kbd>{artist}</kbd> <kbd>{creator}</kbd> <kbd>{diff}</kbd> <kbd>{code}</kbd> <kbd>{myName}</kbd> <kbd>{players}</kbd> <kbd>{r1name}</kbd> <kbd>{r1acc}</kbd>…</p>
    <label>위치 · 크기 (X Y W H)</label><div class="row4"><input type="number" id="pX" value="${e.x}"><input type="number" id="pY" value="${e.y}"><input type="number" id="pW" value="${e.w}"><input type="number" id="pH" value="${e.h}"></div>
  </div>
  <div class="sec props"><h2>글꼴</h2>
    <select id="pFont">${FONTS.map(f=>`<option value="${esc(f[0])}"${(e.font||"game")===f[0]?" selected":""}>${esc(f[1])}</option>`).join("")}</select>
    <div class="row"><div><label for="pSize">크기</label><input type="number" id="pSize" value="${e.size}"></div>
    <div><label for="pWeight">굵기</label><select id="pWeight">${[[400,"보통"],[500,"중간"],[700,"굵게"],[900,"아주 굵게"]].map(([v,n])=>`<option value="${v}"${+e.weight===v?" selected":""}>${n}</option>`).join("")}</select></div></div>
    <label>정렬</label><div class="seg" id="pAlign">${[["left","왼쪽"],["center","가운데"],["right","오른쪽"]].map(([v,n])=>`<button data-v="${v}" class="${(e.align||"left")===v?"on":""}">${n}</button>`).join("")}</div>
  </div>
  <div class="sec props"><h2>색 · 모양</h2>
    ${colorField("pColor","글자색",e.color)}
    ${colorField("pFill","배경색",e.fill)}
    ${colorField("pStroke","테두리색",e.stroke)}
    <div class="row"><div><label for="pRad">모서리 둥글기</label><input type="number" id="pRad" value="${e.radius}"></div>
    <div><label for="pOp">불투명도</label><input type="number" id="pOp" min="0" max="1" step="0.05" value="${e.opacity??1}"></div></div>
  </div>
  <div class="sec props"><h2 style="color:var(--fire)">기능</h2>
    <select id="pFunc">${FUNCS.map(f=>`<option${(e.func||"(없음)")===f?" selected":""}>${esc(f)}</option>`).join("")}</select>
    ${e.func==="직접 적기"?`<label for="pFuncT">기능 이름</label><input type="text" id="pFuncT" value="${esc(e.funcText||"")}">`:""}
    <label for="pNoteE">어떻게 동작하면 좋을지 (Claude가 읽어요)</label><textarea id="pNoteE" placeholder="예: 누르면 방 목록 새로고침, 3초마다 자동 갱신">${esc(e.note||"")}</textarea>
    <div class="acts"><button class="btn sm" id="aDup">복제</button><button class="btn sm" id="aUp">앞으로</button><button class="btn sm" id="aDown">뒤로</button><button class="btn sm danger" id="aDel">지우기</button></div>
  </div>`;
  const s2=cur();
  const bind=(id,key,num)=>{ $("#"+id).oninput=ev=>{ e[key]=num?(+ev.target.value||0):ev.target.value; renderStage(); queueSave(s2); }; $("#"+id).onchange=()=>pushHist(); };
  bind("pLbl","name"); bind("pTxt","text"); bind("pX","x",1); bind("pY","y",1); bind("pW","w",1); bind("pH","h",1);
  bind("pSize","size",1); bind("pRad","radius",1); bind("pOp","opacity",1); bind("pNoteE","note");
  $("#pFont").onchange=ev=>{ e.font=ev.target.value; pushHist(); renderStage(); queueSave(s2); };
  $("#pWeight").onchange=ev=>{ e.weight=+ev.target.value; pushHist(); renderStage(); queueSave(s2); };
  $("#pFunc").onchange=ev=>{ e.func=ev.target.value; pushHist(); render(); queueSave(s2); };
  if($("#pFuncT")) bind("pFuncT","funcText");
  $("#pAlign").querySelectorAll("button").forEach(b=>b.onclick=()=>{ e.align=b.dataset.v; pushHist(); render(); queueSave(s2); });
  [["pColor","color"],["pFill","fill"],["pStroke","stroke"]].forEach(([id,key])=>{
    const set=v=>{ e[key]=v; $("#"+id).value=v; if(/^#[0-9a-f]{6}/i.test(v)) $("#"+id+"c").value=v.slice(0,7); renderStage(); queueSave(s2); };
    $("#"+id).oninput=ev=>set(ev.target.value.trim());
    $("#"+id+"c").oninput=ev=>set(ev.target.value);
    $("#"+id+"c").onchange=()=>pushHist();
    document.querySelector(`.sw[data-for="${id}"]`).querySelectorAll("button").forEach(b=>b.onclick=()=>{ set(b.dataset.c); pushHist(); });
  });
  $("#aDup").onclick=dupSel; $("#aDel").onclick=delSel;
  $("#aUp").onclick=()=>{ const a=s2.elements, i=a.indexOf(e); if(i<a.length-1){ a.splice(i,1); a.splice(i+1,0,e); pushHist(); renderStage(); queueSave(s2);} };
  $("#aDown").onclick=()=>{ const a=s2.elements, i=a.indexOf(e); if(i>0){ a.splice(i,1); a.splice(i-1,0,e); pushHist(); renderStage(); queueSave(s2);} };
}

function render(){ renderScreens(); renderStage(); renderProps(); }

// ---------- 조작 ----------
let drag=null;
function onDown(ev){
  if(ev.button!==0) return;
  ev.stopPropagation();
  const d=ev.currentTarget, s=cur(), e=s.elements.find(x=>x.id===d.dataset.id);
  if(selId!==e.id){ selId=e.id; render(); }
  drag={e, h:ev.target.dataset.h||null, sx:ev.clientX, sy:ev.clientY, o:{x:e.x,y:e.y,w:e.w,h:e.h}, moved:false};
  window.addEventListener("pointermove",onMove); window.addEventListener("pointerup",onUp,{once:true});
}
function snap(v,alt){ return alt?Math.round(v):Math.round(v/SNAP)*SNAP; }
function onMove(ev){
  if(!drag) return;
  const sc=fit.sc||1, dx=(ev.clientX-drag.sx)/sc, dy=(ev.clientY-drag.sy)/sc, e=drag.e, o=drag.o, a=ev.altKey;
  if(Math.abs(dx)+Math.abs(dy)>1) drag.moved=true;
  if(!drag.h){ e.x=snap(o.x+dx,a); e.y=snap(o.y+dy,a); }
  else{
    const h=drag.h;
    if(h.includes("e")) e.w=Math.max(8,snap(o.w+dx,a));
    if(h.includes("s")) e.h=Math.max(6,snap(o.h+dy,a));
    if(h.includes("w")){ const nx=snap(o.x+dx,a); e.w=Math.max(8,o.x+o.w-nx); e.x=o.x+o.w-e.w; }
    if(h.includes("n")){ const ny=snap(o.y+dy,a); e.h=Math.max(6,o.y+o.h-ny); e.y=o.y+o.h-e.h; }
  }
  const el=document.querySelector(`.el[data-id="${e.id}"]`);
  if(el) Object.assign(el.style,{left:e.x+"px",top:e.y+"px",width:e.w+"px",height:e.h+"px"});
}
function onUp(){
  window.removeEventListener("pointermove",onMove);
  if(drag&&drag.moved){ pushHist(); renderStage(); renderProps(); queueSave(cur()); }
  drag=null;
}
$("#wrap").addEventListener("pointerdown",ev=>{ if(ev.target.closest(".el")) return; if(selId){ selId=null; render(); } });

function addEl(type){
  const s=cur(); if(!s) return toast("먼저 화면을 만들어 주세요");
  const T=TYPES[type];
  const e={id:uid(),type,name:"",x:snap((W-T.w)/2),y:snap((H-T.h)/2),w:T.w,h:T.h,text:T.text,font:"game",size:T.size,weight:T.weight,color:T.color,fill:T.fill,stroke:T.stroke,radius:T.radius,opacity:1,align:T.align||"left",func:"(없음)",note:""};
  s.elements.push(e); selId=e.id; pushHist(); render(); queueSave(s);
}
function dupSel(){ const s=cur(), e=selEl(); if(!e) return; const c={...JSON.parse(JSON.stringify(e)),id:uid(),x:e.x+24,y:e.y+24}; s.elements.push(c); selId=c.id; pushHist(); render(); queueSave(s); }
function delSel(){ const s=cur(); if(!selId) return; s.elements=s.elements.filter(x=>x.id!==selId); selId=null; pushHist(); render(); queueSave(s); }

document.addEventListener("keydown",ev=>{
  const tag=(ev.target.tagName||"").toLowerCase();
  if(tag==="input"||tag==="textarea"||tag==="select") return;
  if((ev.ctrlKey||ev.metaKey)&&ev.key.toLowerCase()==="z"){ ev.preventDefault(); undo(); return; }
  const e=selEl(); if(!e) return;
  if(ev.key==="Delete"||ev.key==="Backspace"){ ev.preventDefault(); delSel(); return; }
  if((ev.ctrlKey||ev.metaKey)&&ev.key.toLowerCase()==="d"){ ev.preventDefault(); dupSel(); return; }
  const step=ev.shiftKey?10:1, k={ArrowLeft:[-step,0],ArrowRight:[step,0],ArrowUp:[0,-step],ArrowDown:[0,step]}[ev.key];
  if(k){ ev.preventDefault(); e.x+=k[0]; e.y+=k[1]; renderStage(); renderProps(); clearTimeout(onMove.k); onMove.k=setTimeout(pushHist,400); queueSave(cur()); }
});

// ---------- 화면 ----------
function newScreen(name){
  const s={id:"s"+uid(),name,order:(screens.length?Math.max(...screens.map(x=>x.order??0))+1:0),note:"",bg:null,bgOpacity:.5,status:"",elements:[]};
  screens.push(s); curId=s.id; selId=null; pushHist(); render(); queueSave(s,true);
}
function renameScreen(s){
  modal(`<h3>화면 이름</h3><input type="text" id="mIn" value="${esc(s.name)}"><div class="acts" style="justify-content:flex-end"><button class="btn" id="mNo">취소</button><button class="btn pri" id="mOk">바꾸기</button></div>`);
  $("#mIn").focus(); $("#mIn").select();
  const ok=()=>{ s.name=$("#mIn").value.trim()||s.name; closeModal(); render(); queueSave(s); };
  $("#mOk").onclick=ok; $("#mNo").onclick=closeModal; $("#mIn").onkeydown=ev=>{ if(ev.key==="Enter") ok(); };
}
$("#addScr").onclick=()=>{
  modal(`<h3>새 화면</h3><p class="hint" style="margin-bottom:8px">예: 멀티 섬 입구, 로비, 맵 고르기, 인게임, 결과</p><input type="text" id="mIn" placeholder="화면 이름"><div class="acts" style="justify-content:flex-end"><button class="btn" id="mNo">취소</button><button class="btn pri" id="mOk">만들기</button></div>`);
  $("#mIn").focus();
  const ok=()=>{ const n=$("#mIn").value.trim(); if(!n) return; closeModal(); newScreen(n); };
  $("#mOk").onclick=ok; $("#mNo").onclick=closeModal; $("#mIn").onkeydown=ev=>{ if(ev.key==="Enter") ok(); };
};
function modal(html){ $("#mbox").innerHTML=html; $("#modal").classList.add("on"); }
function closeModal(){ $("#modal").classList.remove("on"); }
function confirmBox(text,okText,fn){ modal(`<h3>확인</h3><p>${esc(text)}</p><div class="acts" style="justify-content:flex-end"><button class="btn" id="mNo">취소</button><button class="btn pri" id="mOk">${esc(okText)}</button></div>`); $("#mNo").onclick=closeModal; $("#mOk").onclick=()=>{ closeModal(); fn(); }; }
$("#modal").addEventListener("pointerdown",ev=>{ if(ev.target.id==="modal") closeModal(); });

// ---------- 참고 스크린샷 ----------
function pickBg(){ if(!assets) return toast("이 보기에서는 이미지를 올릴 수 없어요"); $("#file").click(); }
$("#file").onchange=ev=>{ const f=ev.target.files[0]; ev.target.value=""; if(f) uploadBg(f); };
async function uploadBg(f){
  const s=cur(); if(!s||!assets) return toast("이 보기에서는 이미지를 올릴 수 없어요");
  status("busy","스크린샷 올리는 중…");
  try{ const a=await assets.upload(f); s.bg=a.id; render(); queueSave(s,true); toast("배경으로 깔았어요"); }
  catch(e){ status("err","올리기 실패: "+(e&&e.message||e)); }
}
$("#wrap").addEventListener("dragover",ev=>ev.preventDefault());
$("#wrap").addEventListener("drop",ev=>{ ev.preventDefault(); const f=[...ev.dataTransfer.files].find(x=>x.type.startsWith("image/")); if(f) uploadBg(f); });

// ---------- 상단 버튼 ----------
$("#undoBtn").onclick=undo;
$("#gridBtn").onclick=()=>{ showGrid=!showGrid; $("#gridBtn").textContent=showGrid?"격자 끄기":"격자 켜기"; renderStage(); };
$("#copyBtn").onclick=async()=>{ try{ await navigator.clipboard.writeText(JSON.stringify(screens,null,1)); toast("설계 JSON을 복사했어요"); }catch(_){ toast("복사가 막혔어요"); } };
$("#handBtn").onclick=()=>{
  const s=cur(); if(!s) return;
  modal(`<h3>“${esc(s.name)}” 넘기기</h3><p class="hint" style="margin-bottom:8px">이 화면을 Claude가 게임에 구현할 차례로 표시해요. 채팅에 “넘겼어”라고만 말하면 Claude가 여기 저장된 설계를 읽어요.</p><textarea id="mIn" rows="3" placeholder="전달할 말 (선택)">${esc(s.handoff||"")}</textarea><div class="acts" style="justify-content:flex-end"><button class="btn" id="mNo">취소</button>${s.status==="ready"?'<button class="btn" id="mUn">넘김 취소</button>':""}<button class="btn pri" id="mOk">넘기기</button></div>`);
  $("#mNo").onclick=closeModal;
  if($("#mUn")) $("#mUn").onclick=()=>{ s.status=""; closeModal(); render(); queueSave(s,true); };
  $("#mOk").onclick=()=>{ s.status="ready"; s.handoff=$("#mIn").value; closeModal(); render(); queueSave(s,true); toast("넘겼어요. 채팅에서 알려주세요"); };
};

// ---------- 부품 목록 ----------
const ICON={panel:'<rect x="1.5" y="2.5" width="13" height="11" rx="2"/>',button:'<rect x="1.5" y="5" width="13" height="6" rx="3"/>',text:'<path d="M3 4h10M8 4v9"/>',input:'<rect x="1.5" y="4.5" width="13" height="7" rx="1.5"/><path d="M4 6.5v3"/>',list:'<path d="M2 4h12M2 8h12M2 12h12"/>',chip:'<rect x="2" y="5.5" width="12" height="5" rx="2.5"/>',progress:'<rect x="1.5" y="6.5" width="13" height="3" rx="1.5"/><path d="M2.5 8h6"/>',slider:'<path d="M1.5 8h13"/><circle cx="9" cy="8" r="2.5"/>',image:'<rect x="1.5" y="2.5" width="13" height="11" rx="1.5"/><path d="m2 12 4-4 3 3 2-2 3 3"/>',ranking:'<path d="M3 13V8M8 13V3M13 13V6"/>'};
$("#pal").innerHTML=Object.entries(TYPES).map(([k,t])=>`<button data-t="${k}"><svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4">${ICON[k]}</svg>${esc(t.name)}</button>`).join("");
$("#pal").querySelectorAll("button").forEach(b=>b.onclick=()=>addEl(b.dataset.t));

// ---------- 시작 ----------
window.addEventListener("resize",fit);
new ResizeObserver(fit).observe($("#wrap"));
fit(); render();

(async()=>{
  const c=window.claude;
  if(!c||!c.use){ status("err","저장소에 연결할 수 없어요 (이 보기에서는 저장되지 않아요)"); return; }
  const [d,a,u]=await Promise.all([c.use("db"),c.use("assets"),c.use("user")]);
  db=d; assets=a;
  if(!db){ status("err","로그인해야 저장돼요"); return; }
  try{ if(u&&u.can){ const w=await u.can("data.write"); if(w===false){ canWrite=false; } } }catch(_){}
  const timer=setTimeout(()=>status("err","설계를 아직 못 불러왔어요. 잠시 뒤 다시 열어주세요"),10000);
  let first=true;
  db.collection("screens").onSnapshot(snap=>{
    if(snap.metadata.hasPendingWrites) return;
    clearTimeout(timer);
    let changed=false;
    snap.docs.forEach(doc=>{
      const data=doc.data(); if(!data) return;
      const i=screens.findIndex(x=>x.id===doc.id);
      const st=saveState[doc.id], busy=!!(st&&(st.writing||st.queued));
      if(i<0){ screens.push(JSON.parse(JSON.stringify({...data,id:doc.id}))); changed=true; }
      else if(!drag && (data.updatedAt||0) > (screens[i].updatedAt||0) && !busy){ screens[i]=JSON.parse(JSON.stringify({...data,id:doc.id})); changed=true; }
    });
    const ids=new Set(snap.docs.map(x=>x.id));
    if(!snap.metadata.fromCache){ const before=screens.length; screens=screens.filter(s=>ids.has(s.id)||saveState[s.id]); if(screens.length!==before) changed=true; }
    if(first||changed){
      if(!curId||!screens.find(s=>s.id===curId)){ screens.sort((a,b)=>(a.order??0)-(b.order??0)); curId=screens[0]?.id||null; selId=null; }
      screens.forEach(s=>{ if(!hist[s.id]) hist[s.id]=[JSON.stringify(s.elements)]; });
      render();
    }
    first=false;
    if(!snap.metadata.fromCache) status(canWrite?"ok":"err", canWrite?"불러옴 · 자동 저장 중":"보기 전용이에요 (저장 권한 없음)");
  },err=>{ clearTimeout(timer); status("err","불러오기 실패: "+(err&&err.message||err.code)); });
})();
</script>
